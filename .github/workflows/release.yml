# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# 推送 main 后自动构建 Windows x64 + Linux x64 并发布 GitHub Release，
# 已安装的客户端通过 electron-updater 读取 latest.yml / latest-linux.yml 自动更新。
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Kiro-account-manager/**'
      - '.github/workflows/release.yml'

concurrency:
  group: release
  cancel-in-progress: false

env:
  WORKING_DIR: Kiro-account-manager

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # 版本号必须单调递增，electron-updater 才会认为有新版本
      - id: v
        run: echo "version=1.8.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-windows-x64:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install setuptools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci
      - name: Set version
        working-directory: ${{ env.WORKING_DIR }}
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build
      - name: Package
        working-directory: ${{ env.WORKING_DIR }}
        run: npx electron-builder --win nsis --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            ${{ env.WORKING_DIR }}/dist/*.exe
            ${{ env.WORKING_DIR }}/dist/*.blockmap
            ${{ env.WORKING_DIR }}/dist/latest.yml
          if-no-files-found: error

  build-linux-x64:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install setuptools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci
      - name: Set version
        working-directory: ${{ env.WORKING_DIR }}
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build
      - name: Package
        working-directory: ${{ env.WORKING_DIR }}
        run: npx electron-builder --linux deb AppImage --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            ${{ env.WORKING_DIR }}/dist/*.AppImage
            ${{ env.WORKING_DIR }}/dist/*.deb
            ${{ env.WORKING_DIR }}/dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [version, build-windows-x64, build-linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -lh artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.version.outputs.version }}
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: "Auto build from ${{ github.sha }}"
          files: artifacts/*
