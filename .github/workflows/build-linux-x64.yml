# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Linux x64

on:
  workflow_dispatch:
  push:
    branches: ['fix/**']
    paths:
      - 'Kiro-account-manager/**'
      - '.github/workflows/build-linux-x64.yml'

env:
  WORKING_DIR: Kiro-account-manager

jobs:
  build-linux-x64:
    # 固定 22.04：产物依赖的 glibc 版本较低，22.04 / 24.04 服务器都能运行
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools (for node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      # deb（Ubuntu 用 apt 安装）+ AppImage（免安装）；不打 snap，省掉 snapcraft
      - name: Package Linux x64
        working-directory: ${{ env.WORKING_DIR }}
        run: npx electron-builder --linux deb AppImage --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: ${{ env.WORKING_DIR }}/dist/*.deb
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: ${{ env.WORKING_DIR }}/dist/*.AppImage
          if-no-files-found: error
